name: API Health Ping

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-ping:
    name: API Health Ping
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check — /api/health (schema + DB + env)
        id: health
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            --max-time 10 \
            https://carecompanionai.org/api/health 2>/dev/null || echo "000")
          BODY=$(cat /tmp/health.json 2>/dev/null | head -c 500 || echo "no response")
          echo "status=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/api/health failed: HTTP $HTTP_CODE"
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Send failure alert
        if: steps.health.outputs.failed == 'true'
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b # v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🚨 CareCompanion Health Ping Failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: CareCompanion Alerts <${{ secrets.ALERT_EMAIL_USERNAME }}>
          body: |
            CareCompanion /api/health check failed.

            HTTP ${{ steps.health.outputs.status }}
            Body: ${{ steps.health.outputs.body }}

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail job if health check failed
        if: steps.health.outputs.failed == 'true'
        run: exit 1
